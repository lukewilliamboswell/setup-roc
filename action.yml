name: 'Setup Roc'
description: 'Download and setup the Roc compiler.'
branding:
  icon: 'download'
  color: 'purple'

inputs:
  version:
    description: 'Roc version or mode: stable, stable-and-nightly, nightly, nightly-new-compiler, alpha3-rolling, or alpha4-rolling'
    required: true
  stable-tag:
    description: 'Exact roc-lang/nightlies release tag used by stable and stable-and-nightly modes.'
    required: false
    default: ''
  nightly-tag:
    description: 'Exact roc-lang/nightlies release tag. Latest is used when unset.'
    required: false
    default: ''
  token:
    description: 'GitHub token used to authenticate API requests (avoids rate limiting). Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}

outputs:
  stable-tag:
    description: 'Resolved stable release tag when a stable compiler is installed.'
    value: ${{ steps.install.outputs.stable-tag }}
  stable-executable:
    description: 'Absolute path to the stable Roc executable when installed.'
    value: ${{ steps.install.outputs.stable-executable }}
  stable-install-dir:
    description: 'Stable Roc installation directory when installed.'
    value: ${{ steps.install.outputs.stable-install-dir }}
  nightly-tag:
    description: 'Resolved nightly release tag when a new-compiler nightly is installed.'
    value: ${{ steps.install.outputs.nightly-tag }}
  nightly-executable:
    description: 'Absolute path to the nightly Roc executable in dual mode.'
    value: ${{ steps.install.outputs.nightly-executable }}
  nightly-install-dir:
    description: 'Nightly Roc installation directory in dual mode.'
    value: ${{ steps.install.outputs.nightly-install-dir }}
  resolved-version:
    description: 'Resolved version or tag in single mode.'
    value: ${{ steps.install.outputs.resolved-version }}
  executable:
    description: 'Absolute path to the Roc executable in single mode.'
    value: ${{ steps.install.outputs.executable }}
  install-dir:
    description: 'Roc installation directory in single mode.'
    value: ${{ steps.install.outputs.install-dir }}

runs:
  using: 'composite'
  steps:
    - name: Download and verify Roc
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_STABLE_TAG: ${{ inputs.stable-tag }}
        INPUT_NIGHTLY_TAG: ${{ inputs.nightly-tag }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
